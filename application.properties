# DoEnv 使用 DataO 原有的数据源配置格式。
# 如果 JAR 与 DataO 共用部署目录，可以直接使用 DataO 已有的 application.properties，
# 不需要再复制本模板。

# PostgreSQL
spring.datasource.jdbc-url=jdbc:postgresql://127.0.0.1:5432/datao
spring.datasource.username=datao
spring.datasource.password=请填写实际密码
spring.datasource.driver-class-name=org.postgresql.Driver

# ClickHouse
spring.datasource.clickhouse.address=jdbc:clickhouse://127.0.0.1:8123
spring.datasource.clickhouse.db=datao
spring.datasource.clickhouse.username=default
spring.datasource.clickhouse.password=请填写实际密码
spring.datasource.clickhouse.driver-class-name=ru.yandex.clickhouse.ClickHouseDriver
